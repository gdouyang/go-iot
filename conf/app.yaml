api-addr: :8088

# 默认管理员（仅首次创建 id=1 的 admin 时生效；已有用户不改密）
# 未配置 password 时默认为 123456；生产请设置强密码或环境变量 GOIOT_ADMIN_PASSWORD
# 密码以 bcrypt 存储；旧 MD5 账号登录后会懒升级
admin:
  password: "123456"

# 编解码脚本宿主安全（HttpRequest）
# http-enabled: 关闭后脚本无法发 HTTP
# http-block-private: 禁止访问私网/本机（SSRF 基线）；脚本需调内网时设为 false
script:
  http-enabled: true
  http-block-private: true

# debug, info, warn, error
logs:
  level: debug
  #format: json
  #filename: logs/go-iot.log

# es config
es:
  url: http://localhost:9200
  usename: 
  password: 
  numberOfShards: 1
  numberOfReplicas: 0
# redis config
redis:
  addr: localhost:6379
  db: 0
  password: 

# 集群配置（详见 doc/cluster.md）
# 字段名：enabled（结构体 option.Cluster.Enabled；flag: --cluster.enabled）
# 旧键 enable 在解析时仍兼容（仅当未设置 enabled 时）
cluster:
  enabled: false
  # 节点唯一名，写入设备 ClusterId
  name:
  # 分片序号，多节点时须互不重复且在 [0, 节点数) 内，如 0、1、2…
  index: 0
  token: abc
  # 本机可被其它节点访问的 API 根地址
  # url: http://192.168.31.221:8088
  # 全集群 URL 列表（逗号分隔）
  # hosts: http://192.168.31.221:8088,http://192.168.31.136:8088